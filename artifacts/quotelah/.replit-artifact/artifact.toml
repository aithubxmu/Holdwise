kind = "web"
previewPath = "/"
title = "Holdwise"
description = "Holdwise: AI-read WhatsApp quotations for Malaysian SMEs, shown as a simulated Orbyte Sales module. Synthetic data, Next.js."
version = "1.0.0"
id = "artifacts/quotelah"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20679

[services.development]
run = "pnpm --filter @workspace/quotelah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quotelah", "run", "build" ]
serve = "static"
publicDir = "artifacts/quotelah/out"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20679"
BASE_PATH = "/"
