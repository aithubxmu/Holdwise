openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API liveness
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /messages:
    get:
      operationId: listMessages
      responses:
        "200":
          description: Synthetic inbox messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxMessage"
  /demo-context:
    get:
      operationId: getDemoContext
      responses:
        "200":
          description: Demo metadata and role identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoContext"
  /products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: Shop catalogue with available stock
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
  /messages/{messageId}/quote:
    post:
      operationId: draftQuote
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActorRequest" }
      responses:
        "200":
          description: Draft quotation (existing draft is returned if one exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteDetail" }
  /quotes:
    get:
      operationId: listQuotes
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [drafted, needs_review, awaiting_approval, sent, rejected] }
      responses:
        "200":
          description: Quotations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteDetail" }
  /quotes/{quoteId}:
    get:
      operationId: getQuote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Quotation with priced lines and approval routing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteDetail" }
    patch:
      operationId: updateQuote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteUpdate" }
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteDetail" }
  /quotes/{quoteId}/items/{itemId}:
    patch:
      operationId: updateQuoteItem
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteItemUpdate" }
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteDetail" }
  /quotes/{quoteId}/actions:
    post:
      operationId: quoteAction
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteActionRequest" }
      responses:
        "200":
          description: Quotation after the action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteDetail" }
  /activity:
    get:
      operationId: listActivity
      parameters:
        - { name: quoteId, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Activity log, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Owner settings and whether an AI key is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Updated settings (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /eval:
    get:
      operationId: getLatestEval
      responses:
        "200":
          description: Latest saved evaluation per parser
          content:
            application/json:
              schema:
                type: object
                required: [ai, rules]
                properties:
                  ai: { oneOf: [{ $ref: "#/components/schemas/EvalResult" }, { type: "null" }] }
                  rules: { oneOf: [{ $ref: "#/components/schemas/EvalResult" }, { type: "null" }] }
    post:
      operationId: runEval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalRequest" }
      responses:
        "200":
          description: Fresh evaluation on the synthetic test set (owner only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalResult" }
  /demo/reset:
    post:
      operationId: resetDemo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActorRequest" }
      responses:
        "200":
          description: Demo data wiped and reseeded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    InboxMessage:
      type: object
      required: [id, customerId, customerName, customerType, phone, zone, body, receivedAt, status, quoteId]
      properties:
        quoteId: { type: [integer, "null"] }
        id: { type: integer }
        customerId: { type: integer }
        customerName: { type: string }
        customerType: { type: string, enum: [walk_in, regular, contractor] }
        phone: { type: string }
        zone: { type: string }
        body: { type: string }
        receivedAt: { type: string }
        status: { type: string, enum: [new, drafted, needs_review, awaiting_approval, sent, rejected] }
    DemoUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [owner, staff, viewer] }
    DemoContext:
      type: object
      required: [shopName, users, productCount, customerCount, zoneCount, milestone]
      properties:
        shopName: { type: string }
        users:
          type: array
          items: { $ref: "#/components/schemas/DemoUser" }
        productCount: { type: integer }
        customerCount: { type: integer }
        zoneCount: { type: integer }
        milestone: { type: string }
    Settings:
      type: object
      required: [aiExtraction, manualMinutesPerQuote, startingCredits, ai]
      properties:
        aiExtraction: { type: boolean }
        manualMinutesPerQuote: { type: number }
        startingCredits: { type: integer }
        ai:
          type: object
          required: [configured, provider, model]
          properties:
            configured: { type: boolean }
            provider: { type: [string, "null"] }
            model: { type: [string, "null"] }
    SettingsUpdate:
      type: object
      required: [actorUserId]
      properties:
        actorUserId: { type: integer }
        aiExtraction: { type: boolean }
        manualMinutesPerQuote: { type: number, minimum: 1, maximum: 240 }
        startingCredits: { type: integer, minimum: 0, maximum: 100000 }
    EvalRequest:
      type: object
      required: [actorUserId, mode]
      properties:
        actorUserId: { type: integer }
        mode: { type: string, enum: [ai, rules] }
    EvalSummary:
      type: object
      required: [itemsExpected, itemsCorrect, extractionAccuracyPct, qtyAccuracyPct, extraLines, flagsRaised, zoneAccuracyPct]
      properties:
        itemsExpected: { type: integer }
        itemsCorrect: { type: integer }
        extractionAccuracyPct: { type: [number, "null"] }
        qtyAccuracyPct: { type: [number, "null"] }
        extraLines: { type: integer }
        flagsRaised: { type: integer }
        zoneAccuracyPct: { type: [number, "null"] }
    EvalRow:
      type: object
      required: [id, set, text, expected, correct, qtyCorrect, extra, flags, parsedBy, fallbackReason, latencyMs, lines]
      properties:
        id: { type: string }
        set: { type: string }
        text: { type: string }
        expected: { type: integer }
        correct: { type: integer }
        qtyCorrect: { type: integer }
        extra: { type: integer }
        flags: { type: integer }
        parsedBy: { type: string }
        fallbackReason: { type: [string, "null"] }
        latencyMs: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [rawText, product, qty, flags]
            properties:
              rawText: { type: string }
              product: { type: [string, "null"] }
              qty: { type: integer }
              flags: { type: array, items: { type: string } }
    EvalResult:
      type: object
      required: [mode, model, ranAt, messages, avgLatencyMs, fallbacks, all, seed, heldOut, rows]
      properties:
        mode: { type: string, enum: [ai, rules] }
        model: { type: [string, "null"] }
        ranAt: { type: string }
        messages: { type: integer }
        avgLatencyMs: { type: integer }
        fallbacks: { type: integer }
        all: { $ref: "#/components/schemas/EvalSummary" }
        seed: { $ref: "#/components/schemas/EvalSummary" }
        heldOut: { $ref: "#/components/schemas/EvalSummary" }
        rows: { type: array, items: { $ref: "#/components/schemas/EvalRow" } }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ActorRequest:
      type: object
      required: [actorUserId]
      properties:
        actorUserId: { type: integer }
    QuoteUpdate:
      type: object
      required: [actorUserId, discountPct]
      properties:
        actorUserId: { type: integer }
        discountPct: { type: number, minimum: 0, maximum: 100 }
    QuoteItemUpdate:
      type: object
      required: [actorUserId]
      properties:
        actorUserId: { type: integer }
        productId: { type: integer }
        qty: { type: integer, minimum: 0 }
        unitPriceRm: { type: string, pattern: "^\\d+(\\.\\d{1,2})?$" }
        confirm: { type: boolean, description: "Staff confirms a low-confidence match" }
        remove: { type: boolean }
    QuoteActionRequest:
      type: object
      required: [actorUserId, action]
      properties:
        actorUserId: { type: integer }
        action: { type: string, enum: [send, request_approval, approve, return] }
        comment: { type: string, maxLength: 500 }
    CatalogItem:
      type: object
      required: [id, sku, name, unit, priceRm, available, category, variantGroup]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        priceRm: { type: string }
        available: { type: integer }
        category: { type: string }
        variantGroup: { type: [string, "null"] }
    QuoteOption:
      type: object
      required: [id, name, priceRm, available]
      properties:
        id: { type: integer }
        name: { type: string }
        priceRm: { type: string }
        available: { type: integer }
    QuoteLine:
      type: object
      required: [id, rawText, productId, productName, unit, qty, unitPriceRm, catalogPriceRm, lineTotalRm, confidence, flags, available, options]
      properties:
        id: { type: integer }
        rawText: { type: string }
        productId: { type: [integer, "null"] }
        productName: { type: [string, "null"] }
        unit: { type: [string, "null"] }
        qty: { type: integer }
        unitPriceRm: { type: [string, "null"] }
        catalogPriceRm: { type: [string, "null"] }
        lineTotalRm: { type: [string, "null"] }
        confidence: { type: number }
        flags:
          type: array
          items: { type: string, enum: [unknown_item, ambiguous_variant, low_confidence, missing_quantity, invalid_quantity, insufficient_stock] }
        available: { type: [integer, "null"] }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuoteOption" }
    QuoteDetail:
      type: object
      required: [id, messageId, messageBody, receivedAt, customerName, customerType, customerPhone, deliveryZone, status, parsedBy,
        lines, subtotalRm, discountPct, discountRm, deliveryRm, totalRm, totalsComplete, approvalReasons, openFlags,
        canSend, needsOwner, createdAt, sentAt, validUntil, lastComment, parser]
      properties:
        parser:
          type: object
          required: [model, latencyMs, fallbackReason, language, notes]
          properties:
            model: { type: [string, "null"] }
            latencyMs: { type: [integer, "null"] }
            fallbackReason: { type: [string, "null"] }
            language: { type: [string, "null"] }
            notes: { type: [string, "null"] }
        id: { type: integer }
        messageId: { type: integer }
        messageBody: { type: string }
        receivedAt: { type: string }
        customerName: { type: string }
        customerType: { type: string, enum: [walk_in, regular, contractor] }
        customerPhone: { type: string }
        deliveryZone: { type: string }
        status: { type: string, enum: [new, drafted, needs_review, awaiting_approval, sent, rejected] }
        parsedBy: { type: string, enum: [ai, rules] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuoteLine" }
        subtotalRm: { type: string }
        discountPct: { type: number }
        discountRm: { type: string }
        deliveryRm: { type: string }
        totalRm: { type: string }
        totalsComplete: { type: boolean }
        approvalReasons:
          type: array
          items: { type: string }
        openFlags: { type: integer }
        canSend:
          type: object
          required: [owner, staff, viewer]
          properties:
            owner: { type: boolean }
            staff: { type: boolean }
            viewer: { type: boolean }
        needsOwner: { type: boolean }
        createdAt: { type: string }
        sentAt: { type: [string, "null"] }
        validUntil: { type: string }
        lastComment: { type: [string, "null"] }
    ActivityEntry:
      type: object
      required: [id, at, actorName, actorRole, action, entity, entityId, summary, details]
      properties:
        id: { type: integer }
        at: { type: string }
        actorName: { type: [string, "null"] }
        actorRole: { type: [string, "null"] }
        action: { type: string }
        entity: { type: string }
        entityId: { type: [integer, "null"] }
        summary: { type: string }
        details: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

